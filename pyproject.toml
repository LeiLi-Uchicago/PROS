[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pros-sketch"
version = "0.1.0"
description = "Partitioned and Refined Oversampling Sketches for certified geometric sketching."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Lei Li" }
]
keywords = [
  "sketching",
  "single-cell",
  "subsampling",
  "k-center",
  "coreset",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
adata = [
  "anndata>=0.9",
]
scanpy = [
  "anndata>=0.9",
  "scanpy>=1.9",
]
scsampler = [
  "scsampler",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
all = [
  "anndata>=0.9",
  "scanpy>=1.9",
  "scsampler",
  "pytest>=8",
  "ruff>=0.6",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/LeiLi-Uchicago/PROS"
Issues = "https://github.com/LeiLi-Uchicago/PROS/issues"

[tool.hatch.build.targets.wheel]
packages = ["pros"]

[tool.hatch.build.targets.sdist]
include = [
  "/pros",
  "/tests",
  "/examples",
  "/data",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/mkdocs.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

